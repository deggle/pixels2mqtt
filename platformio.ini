; PlatformIO project: Pixels dice -> MQTT gateway
; Target: ESP32-C6 (generic devkit board profile; NanoC6 pinout not used), Arduino framework

[platformio]
default_envs = nanoc6

[env:nanoc6]
; Official espressif32 only ships Arduino core 2.0.x, which has no ESP32-C6 support.
; pioarduino provides Arduino core 3.x (pinned for reproducible builds).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitm-1
; No NanoC6 board profile in pioarduino, but the core ships its pin map
; (RGB_LED_DATA_PIN, RGB_LED_PWR_PIN, BTN_PIN, ...)
board_build.variant = m5stack_nanoc6
framework = arduino
monitor_speed = 115200
; NanoC6 enumerates as Espressif USB-Serial/JTAG (VID:PID 303A:1001). Pin the
; port so auto-detect doesn't pick another board; check `pio device list` if it moves.
upload_port = COM9
monitor_port = COM9
; NanoC6 USB-C goes to the C6's built-in USB-Serial/JTAG controller (HWCDC).
; The C6 has no USB-OTG, so USB_MODE=1 is required or Serial maps to the
; non-existent USBSerial.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; NimBLE C++ logs at warnings only (info logs every BLE advert in range)
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
; BLE + Wi-Fi + MQTT exceed the default 1 MB app partition on 4 MB flash
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.1
